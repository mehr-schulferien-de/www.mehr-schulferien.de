name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

# Queue deployments - each one waits for the previous to finish
# No deployments are cancelled, they run sequentially
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, production]

    steps:
      - name: Update repository and deploy
        run: |
          cd ~/app/build/repo
          # First update the repo to get the latest deploy script
          git fetch origin master
          git reset --hard origin/master
          # Now run the updated deploy script
          ./scripts/deploy.sh
